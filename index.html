        <link rel="stylesheet" href="style.css">

    <body>
        <h1>Quilt Builder</h1>
        <p>Welcome to the Quilt Builder! Create your own unique quilt patterns with ease.</p>
        <div id="fabric-studio">
            <h2>Fabric Studio</h2>
            <label>Fabric A <input type="color" id="fab-A" value="#f3ead8"></label>
            <label>Fabric B <input type="color" id="fab-B" value="#31435f"></label>
            <label>Fabric C <input type="color" id="fab-C" value="#c9a227"></label>
            <label>Fabric D <input type="color" id="fab-D" value="#8a4b5c"></label>
        </div>

        <div id="diff-tabs"></div>
        <div id="library"></div>

        <div id="preview">
            <h2>Quilt Preview</h2>
            <p id="preview-name">Pick a block below to preview it here.</p>
            <div id="preview-block"></div>
            <h3>Quilt top (4 by 4)</h3>
            <div id="quilt-top"></div>
        </div>
