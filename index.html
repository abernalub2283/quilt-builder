<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Quilt Builder</title>
        <link rel="stylesheet" href="style.css">
        <link rel="apple-touch-icon" href="icon.png">
        <link rel="manifest" href="manifest.json">
        <meta name="theme-color" content="#1a1a2e">

    </head>
    <body>
        <h1>Quilt Builder</h1>
        <p>Welcome to the Quilt Builder! Create your own unique quilt patterns with ease.</p>
        <div id="fabric-studio">
            <h2>Fabric Studio</h2>
            <label>Fabric A <input type="color" id="fab-A" value="#f3ead8"></label>
            <label>Fabric B <input type="color" id="fab-B" value="#31435f"></label>
            <label>Fabric C <input type="color" id="fab-C" value="#c9a227"></label>
            <label>Fabric D <input type="color" id="fab-D" value="#8a4b5c"></label>
        </div>

        <div id="diff-tabs"></div>
        <div id="library"></div>

        <div id="preview">
            <h2>Quilt Preview</h2>
            <p id="preview-name">Pick a block below to preview it here.</p>
            <div id="preview-block"></div>
            <h3>Quilt top (4 by 4)</h3>
            <div id="quilt-top"></div>
        </div>

        <script>
            const blocks = [
            // ---- Beginner ----
            { id: 'four-patch', name: 'Four Patch', difficulty: 'beginner', grid: [
                'AB',
                'BA'
            ]},
            { id: 'nine-patch', name: 'Nine Patch', difficulty: 'beginner', grid: [
                'ABA',
                'BAB',
                'ABA'
            ]},
            { id: 'checkerboard', name: 'Checkerboard', difficulty: 'beginner', grid: [
                'ABAB',
                'BABA',
                'ABAB',
                'BABA'
            ]},
            { id: 'rail-fence', name: 'Rail Fence', difficulty: 'beginner', grid: [
                'AAAA',
                'BBBB',
                'CCCC',
                'DDDD'
            ]},
            { id: 'bar-quilt', name: 'Bar Quilt', difficulty: 'beginner', grid: [
                'ABCD',
                'ABCD',
                'ABCD',
                'ABCD'
            ]},
            { id: 'framed-square', name: 'Framed Square', difficulty: 'beginner', grid: [
                'AAAAA',
                'ABBBA',
                'ABBBA',
                'ABBBA',
                'AAAAA'
            ]},
            // ---- Intermediate ----
            { id: 'pinwheel', name: 'Pinwheel', difficulty: 'intermediate', grid: [
                'ABBA',
                'ABBA',
                'BAAB',
                'BAAB'
            ]},
            { id: 'hourglass', name: 'Hourglass', difficulty: 'intermediate', grid: [
                'ABBA',
                'BAAB',
                'BAAB',
                'ABBA'
            ]},
            { id: 'shoo-fly', name: 'Shoo Fly', difficulty: 'intermediate', grid: [
                'ABA',
                'BBB',
                'ABA'
            ]},
            { id: 'friendship-star', name: 'Friendship Star', difficulty: 'intermediate', grid: [
                'AABAA',
                'AABAA',
                'BBBBB',
                'AABAA',
                'AABAA'
            ]},
            { id: 'square-in-square', name: 'Square in a Square', difficulty: 'intermediate', grid: [
                'AABAA',
                'ABBBA',
                'BBBBB',
                'ABBBA',
                'AABAA'
            ]},
            { id: 'log-cabin', name: 'Log Cabin', difficulty: 'intermediate', grid: [
                'AAAAAAA',
                'ABBBBBA',
                'ABCCCBA',
                'ABCDCBA',
                'ABCCCBA',
                'ABBBBBA',
                'AAAAAAA'
            ]},
            // ---- Advanced ----
            { id: 'morning-star', name: 'Morning Star', difficulty: 'advanced', grid: [
                'BAABAAB',
                'ABABABA',
                'AABBBAA',
                'BBBCBBB',
                'AABBBAA',
                'ABABABA',
                'BAABAAB'
            ]},
            { id: 'sawtooth-star', name: 'Sawtooth Star', difficulty: 'advanced', grid: [
                'AABBBAA',
                'AABBBAA',
                'BBBCBBB',
                'BBCCCBB',
                'BBBCBBB',
                'AABBBAA',
                'AABBBAA'
            ]},
            { id: 'churn-dash', name: 'Churn Dash', difficulty: 'advanced', grid: [
                'ABBBA',
                'BAAAB',
                'BABAB',
                'BAAAB',
                'ABBBA'
            ]},
            { id: 'double-nine-patch', name: 'Double Nine Patch', difficulty: 'advanced', grid: [
                'ABAABAABA',
                'BABAAABAB',
                'ABAABAABA',
                'AAAAAAAAA',
                'AAAAAAAAA',
                'AAAAAAAAA',
                'ABAABAABA',
                'BABAAABAB',
                'ABAABAABA'
            ]},
            { id: 'broken-dishes', name: 'Broken Dishes', difficulty: 'advanced', grid: [
                'ABBAAB',
                'BAABBA',
                'BAABBA',
                'ABBAAB',
                'ABBAAB',
                'BAABBA'
            ]},
            { id: 'diamond-band', name: 'Diamond Band', difficulty: 'advanced', grid: [
                'AABBAA',
                'ABBBBA',
                'BBBBBB',
                'BBBBBB',
                'ABBBBA',
                'AABBAA'
            ]}
        ];

        let fabrics = JSON.parse(localStorage.getItem('quiltFabrics')) ||{
            A: '#f3ead8',
            B: '#31435f',
            C: '#c9a227',
            D: '#8a4b5c'
        };

        let activeDifficulty = 'beginner';
        let selectedBlockId = localStorage.getItem('quiltSelected') || null;
        const difficulties = [
            { id: 'beginner', label: 'Beginner' },
            { id: 'intermediate', label: 'Intermediate' },
            { id: 'advanced', label: 'Advanced' }
        ];

        const diffTabs = document.getElementById('diff-tabs');
        const library = document.getElementById('library');

        function renderTabs() {
            diffTabs.innerHTML = difficulties.map(d =>
                `<button data-id="${d.id}"${d.id === activeDifficulty ? ' class="active"' : ''}>${d.label}</button>`
            ).join('');
        }

        function blockCells(block) {
            return block.grid.map(function(row) {
                return row.split('').map(function(cell) {
                    return `<div class="cell" style="background-color: ${fabrics[cell]}"></div>`;
                }).join('');
            }).join('');
        }

        function fabricsUsed(block) {
            const letters = [];
            block.grid.join('').split('').forEach(function(ch) {
                if (!letters.includes(ch)) letters.push(ch);
            });
            return letters.join(', ');
        }

        function renderLibrary() {
            const shown = blocks.filter(b => b.difficulty === activeDifficulty);
            library.innerHTML = shown.map(function(block) {
                const size = block.grid[0].length;
                const label = difficulties.find(d => d.id === block.difficulty).label;
                return `
                <div class="block-card${block.id === selectedBlockId ? ' selected' : ''}" data-id="${block.id}">
                    <h3>${block.name}</h3>
                    <p class="diff-label">${label}</p>
                    <div class="block" style="grid-template-columns: repeat(${size}, 1fr)">
                        ${blockCells(block)}
                    </div>
                    <p class="fabrics">Fabrics: ${fabricsUsed(block)}</p>
                </div>`;
            }).join('');
        }

        diffTabs.addEventListener('click', function(event) {
            if (!event.target.matches('button')) return;
            activeDifficulty = event.target.dataset.id;
            renderTabs();
            renderLibrary();
        });

        renderTabs();
        renderLibrary();

        const fabInputs = {
            A: document.getElementById('fab-A'),
            B: document.getElementById('fab-B'),
            C: document.getElementById('fab-C'),
            D: document.getElementById('fab-D')
        };

        Object.keys(fabInputs).forEach(function(letter) {
            fabInputs[letter].value = fabrics[letter];
            fabInputs[letter].addEventListener('input', function(event) {
                fabrics[letter] = event.target.value;
                localStorage.setItem('quiltFabrics', JSON.stringify(fabrics));
                renderLibrary();
                renderPreview();
            });
        });

        const previewName = document.getElementById('preview-name');
        const previewBlock = document.getElementById('preview-block');
        const quiltTop = document.getElementById('quilt-top');

        function tiledGrid(block, tiles) {
            const big = [];
            for (let t = 0; t < tiles; t++) {
                block.grid.forEach(function(row) {
                    big.push(row.repeat(tiles));
                });
            }
            return big;
        }

        function renderPreview() {
            const block = blocks.find(b => b.id === selectedBlockId);
            if (!block) {
                previewName.textContent = 'Pick a block below to preview it here.';
                previewBlock.innerHTML = '';
                quiltTop.innerHTML = '';
                return;
            }
            previewName.textContent = block.name;
            const size = block.grid[0].length;
            previewBlock.innerHTML = `<div class="block" style="grid-template-columns: repeat(${size}, 1fr)">${blockCells(block)}</div>`;
            const big = tiledGrid(block, 4);
            const bigSize = big[0].length;
            quiltTop.innerHTML = `<div class="block" style="grid-template-columns: repeat(${bigSize}, 1fr)">${blockCells({ grid: big })}</div>`;
        }

        library.addEventListener('click', function(event) {
            const card = event.target.closest('.block-card');
            if (!card) return;
            selectedBlockId = card.dataset.id;
            localStorage.setItem('quiltSelected', selectedBlockId);
            renderLibrary();
            renderPreview();
        });

        renderPreview();

        </script>
    </body>
</html>
